# dictator — local speech-to-text (https://github.com/varlogtim/dictator)
#
# Paste into sway config (in linux_config: sway/template.config; single '#'
# comments survive Mako). The same key toggles its mode off again; pressing
# the other key switches modes directly. -notify raises a desktop
# notification when the request fails (daemon down, model still loading,
# wtype not installed) — otherwise the waybar module is the only feedback.
bindsym $mod+Ctrl+i exec dictator -notify toggle type
bindsym $mod+Ctrl+n exec dictator -notify toggle notes
